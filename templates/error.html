{% extends 'base.html' %}
{% block title %}操作提示 · 课堂签到{% endblock %}
{% block page_class %}receipt-page{% endblock %}
{% block content %}
  <section class="card receipt-card error-card" aria-labelledby="error-title">
    <div class="error-mark">{{ icon('alert', 34) }}</div>
    <div class="eyebrow">操作提示</div>
    <h1 id="error-title">再试一次。</h1>
    <p class="intro">{{ message }}</p>
    <a class="button primary full-width" href="{{ url_for('dashboard') if session.get('teacher_id') else url_for('checkin') }}">返回首页 {{ icon('arrow', 17) }}</a>
  </section>
{% endblock %}
