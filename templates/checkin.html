{% extends 'base.html' %}
{% block page_class %}narrow-page{% endblock %}
{% block content %}
  <section class="card checkin-card">
    <div class="eyebrow">STUDENT CHECK-IN</div>
    <h1>来上课，签个到。</h1>
    <p class="intro">填写老师提供的签到码和你的信息。</p>
    <form class="form-stack" method="post" action="{{ url_for('checkin') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="code">签到码</label>
        <input class="code-input" id="code" name="code" value="{{ values.code }}" type="text" placeholder="000000" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required aria-describedby="code-hint">
        <span class="field-hint" id="code-hint">6 位数字，签到结束后失效</span>
      </div>
      <div class="field">
        <label for="student_id">学号</label>
        <input id="student_id" name="student_id" value="{{ values.student_id }}" placeholder="请输入学号" inputmode="numeric" pattern="[0-9]{4,24}" minlength="4" maxlength="24" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" name="name" value="{{ values.name }}" placeholder="请输入姓名" maxlength="30" autocomplete="name" required>
      </div>
      <button class="button primary full-width" type="submit" data-submit-text="正在提交…">确认签到</button>
    </form>
    <p class="card-note">同一学号在每次签到中只需提交一次。</p>
  </section>
{% endblock %}
